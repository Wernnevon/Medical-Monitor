<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Envinya Care</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#071C55">
    <script>
      // Aplica o tema antes da primeira pintura — a mesma regra do
      // ThemeService. Sem isto a tela de carregamento abria sempre clara e
      // piscava para o escuro quando o Angular subia.
      (function () {
        var tema = null;
        try { tema = localStorage.getItem('vittaly-tema'); } catch (e) {}
        if (tema !== 'claro' && tema !== 'escuro') {
          tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        }
        document.documentElement.setAttribute('data-theme', tema);
      })();
    </script>
    <style>
      /* Os tokens de _tokens.scss ainda não carregaram aqui: os valores são
         os mesmos, repetidos para esta tela só. */
      .abertura {
        --ab-fundo: #f8f8f6;
        --ab-texto: #1c2430;
        --ab-suave: #667085;
        --ab-marca: #071c55;
        --ab-trilho: #e4e7ec;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        min-height: 100dvh;
        padding: 1rem;
        background: var(--ab-fundo);
        color: var(--ab-texto);
        font-family: 'Poppins', system-ui, sans-serif;
        text-align: center;
      }
      [data-theme='escuro'] .abertura {
        --ab-fundo: #12161f;
        --ab-texto: #e9ecf2;
        --ab-suave: #a7b0c2;
        --ab-marca: #8fa8f2;
        --ab-trilho: #2c3448;
      }
      [data-theme='escuro'] body { background: #12161f; }
      .abertura__logo {
        width: 4rem;
        aspect-ratio: 130.416 / 136.559;
        background-color: var(--ab-marca);
        mask: url('/assets/logo_vittaly.svg') center / contain no-repeat;
      }
      .abertura__barra {
        width: 10rem;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--ab-trilho);
      }
      .abertura__barra::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: var(--ab-marca);
        animation: abertura-corre 1.1s ease-in-out infinite;
      }
      .abertura__titulo {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
      }
      .abertura__detalhe {
        margin: 0;
        font-size: 1rem;
        color: var(--ab-suave);
      }
      @keyframes abertura-corre {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .abertura__barra::after { animation: none; width: 100%; opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="abertura" role="status" aria-live="polite">
        <div class="abertura__logo" aria-hidden="true"></div>
        <div class="abertura__barra" aria-hidden="true"></div>
        <p class="abertura__titulo">Abrindo o Envinya Care</p>
        <p class="abertura__detalhe">Verificando sua sessão…</p>
      </div>
    </app-root>
    <noscript>Para usar o Envinya Care, ative o JavaScript do navegador.</noscript>
  </body>
</html>
